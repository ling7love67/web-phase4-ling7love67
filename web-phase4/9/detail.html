<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务清单详情</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f4f6f8;
        }
        header {
            background-color: #205b94;
            color:#fff;
            padding:16px;
            text-align:center;
        }
        nav {
            background-color: #3674b9;
            padding:10px 16px;
        }
        nav a {
            display:inline-block;
            color:white;
            text-decoration:none;
            padding:6px 14px;
            margin-right:8px;
            background:#5494d8;
            border-radius:4px;
        }
        nav a:hover {
            background:#73adee;
        }
        main {
            padding:20px;
            max-width:900px;
            margin:0 auto;
        }
        section {
            background:#fff;
            padding:20px;
            border-radius:6px;
        }
        .add-area {
            margin-bottom:16px;
        }
        input {
            padding:6px;
            width:70%;
        }
        button {
            padding:6px 12px;
            cursor:pointer;
        }
        footer {
            background-color:#205b94;
            color:#fff;
            text-align:center;
            padding:12px;
            margin-top:30px;
        }
        @media (max-width:375px) {
            nav a {
                width:100%;
                margin:4px 0;
                display:block;
                text-align:center;
            }
            input {
                width:60%;
            }
        }
    </style>
</head>
<body>
<header>
    <h2>任务清单详情页</h2>
</header>
<nav>
    <a href="index.html">首页</a>
    <a href="detail.html">项目详情</a>
</nav>
<main>
    <section>
        <h3>新增任务</h3>
        <div class="add-area">
            <input type="text" id="taskInput" placeholder="输入任务内容">
            <button onclick="addTask()">添加任务</button>
        </div>
        <div id="taskList"></div>
    </section>
</main>
<footer>
    <p>© 2026 前端实训作业</p >
</footer>

<script>
    // 任务清单JS
    let taskArr = [];
    function addTask(){
        const val = document.getElementById('taskInput').value.trim();
        if(!val) return;
        taskArr.push({text:val,done:false});
        render();
        document.getElementById('taskInput').value = '';
    }
    function render(){
        const wrap = document.getElementById('taskList');
        wrap.innerHTML = '';
        taskArr.forEach((item,idx)=>{
            const div = document.createElement('div');
            div.style.margin='8px 0';
            div.innerHTML = `
                <input type="checkbox" ${item.done?'checked':''} onchange="toggle(${idx})">
                <span style="${item.done?'text-decoration:line-through;color:#888;':''}">${item.text}</span>
            `
            wrap.appendChild(div);
        })
    }
    function toggle(i){
        taskArr[i].done = !taskArr[i].done;
        render();
    }
</script>
</body>
</html>
